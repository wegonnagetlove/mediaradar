# База аккаунтов для радара. Instagram и Threads принадлежат Meta, признанной экстремистской
# и запрещённой в РФ; публичные аккаунты используются только как новостные источники.
#
# Формат: {name: имя без @, region: ru|intl, tier: 1|2}
#   region: ru  российские идут в отбор первыми
#   tier: 1     проверяется каждый запуск; остальные по кругу (лимит API, см. config.yaml)
# Имена собраны по открытым данным. Неверные, закрытые и личные (не бизнес) аккаунты
# радар сам отключает после трёх ошибок подряд; список отключённых показывает check.

