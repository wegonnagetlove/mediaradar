# GitHub выключает расписание в публичном репозитории, если 60 дней не было коммитов.
# Раз в месяц этот workflow делает пустой служебный коммит, и радар не засыпает.
name: Не засыпать

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "keepalive" || exit 0
          git push
