name: Радар новостей

on:
  # По расписанию радар запускает workflow «Радар: дежурство» (relay.yml).
  # Этот workflow для ручных запусков: проверка источников, разовый выпуск, пробный прогон.
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим: B обычный (по расписанию сам выберет утренний выпуск или тишину), A разовый за час, D утренний выпуск"
        type: choice
        options: [A, B, D]
        default: A
      action:
        description: "run — запуск; dry-run — без отправки; check — проверить источники; diagnose — последний час без памяти и без отправки"
        type: choice
        options: [run, dry-run, check, diagnose]
        default: run
      status:
        description: "Прислать в бот отчёт о запуске (для внешнего будильника: no)"
        type: choice
        options: ["yes", "no"]
        default: "yes"

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Память радара
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Запуск
        run: |
          ACTION="${{ inputs.action || 'run' }}"
          MODE="${{ inputs.mode || 'B' }}"
          export RADAR_STATUS="${{ inputs.status || 'no' }}"
          case "$ACTION" in
            check)   python -m radar -v check ;;
            dry-run) python -m radar -v run --mode "$MODE" --dry-run ;;
            diagnose) python -m radar -v run --mode A --ignore-seen ;;
            *)       python -m radar -v run --mode "$MODE" ;;
          esac

      - name: Сохранить память
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}

      - name: Архив выпусков
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digests/
          if-no-files-found: ignore
          retention-days: 14
