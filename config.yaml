  # Добавляйте каналы инсайдеров, брендов, артистов, музеев.
  telegram:
    - {name: breakingmash, label: Mash, region: ru}
    - {name: bazabazon, label: Baza, region: ru}
    - {name: shot_shot, label: SHOT, region: ru}
    - {name: tass_agency, label: ТАСС, region: ru}
    - {name: rian_ru, label: РИА Новости, region: ru}
    - {name: kommersant, label: Коммерсантъ, region: ru}

  # Прямые RSS-ленты (время публикации из ленты).
  rss:
    - {url: "https://wwd.com/feed/", label: WWD, region: intl}
    - {url: "https://fashionista.com/.rss/full/", label: Fashionista, region: intl}
    - {url: "https://pagesix.com/feed/", label: Page Six, region: intl}
    - {url: "https://variety.com/feed/", label: Variety, region: intl}
    - {url: "https://deadline.com/feed/", label: Deadline, region: intl}
    - {url: "https://www.hollywoodreporter.com/feed/", label: The Hollywood Reporter, region: intl}
    - {url: "https://www.billboard.com/feed/", label: Billboard, region: intl}
    - {url: "https://pitchfork.com/rss/news/", label: Pitchfork, region: intl}
    - {url: "https://news.artnet.com/feed", label: Artnet News, region: intl}
    - {url: "https://www.artnews.com/feed/", label: ARTnews, region: intl}
    - {url: "https://www.dezeen.com/feed/", label: Dezeen, region: intl}
    - {url: "https://hypebeast.com/feed", label: Hypebeast, region: intl}

  # Google News: поиск по сайтам и темам с окном when:1h.
  # Покрывает издания без RSS и российскую повестку.
  google_news:
    ru:
      - "ЦУМ OR ДЛТ OR KM20 OR \"Модный дом\""
      - "креативный директор назначен OR покинул бренд"
      - "российский бренд одежды открытие OR закрытие OR коллаборация"
      - "директор музея назначен OR уволен OR отставка"
      - "певец OR певица OR рэпер суд OR иск OR расставание OR скандал"
      - "лейбл артист конфликт OR контракт OR права на песни"
      - "главный редактор журнал назначен OR покидает"
      - "Beinopen OR \"Fashion Consulting Group\" рынок одежды"
      - "аукцион продана картина рекорд Россия"
      - "site:tass.ru культура"
      - "site:kommersant.ru мода OR культура OR шоу-бизнес"
    intl:
      - "site:businessoffashion.com"
      - "site:voguebusiness.com"
      - "site:thecut.com"
      - "site:airmail.news"
      - "site:puck.news"
      - "site:theartnewspaper.com"
      - "site:highsnobiety.com"
      - "site:dazeddigital.com"
      - "site:archdaily.com"
      - "creative director appointed OR exits fashion house"
      - "luxury group acquisition OR stake OR CEO steps down"
      - "Diet Prada OR stylenotcom"

# ── Instagram напрямую ───────────────────────────────────────
# Instagram принадлежит Meta, признанной экстремистской и запрещённой в РФ;
# публичные аккаунты используются только как новостные источники.
# Посты приходят с точным временем публикации. Подключение: README → «Instagram».
#
# provider: graph  официальный Instagram Graph API (Business Discovery), бесплатно.
#                  Secrets: IG_ACCESS_TOKEN, IG_USER_ID. Видит бизнес- и авторские аккаунты.
#           apify  платный парсер публичных постов. Secret: APIFY_TOKEN.
# У любого аккаунта можно указать feed: <url RSS-моста>, тогда он читается по RSS
# независимо от provider (пригодится для личных профилей, которых не видит graph).
instagram:
  enabled: true
  provider: graph
  per_account: 8              # сколько последних постов смотреть у каждого аккаунта
  min_interval_minutes: 0     # для apify поставьте 30–60, чтобы не платить за каждый запуск
  graph_api_version: ""       # пусто: версия по умолчанию вашего приложения Meta
  apify_actor: apify~instagram-post-scraper
  apify_input: {}             # дополнительные поля входа актора, если понадобятся
  accounts:
    # международная индустрия
    - diet_prada
    - stylenotcom
    - hautelemode
    - ideservecouture
    - voguerunway
    - voguebusiness
    - bof
    - wwd
    - theimpression_
    - databutmakeitfashion
    - highsnobiety
    - hypebeast
    # российские аккаунты (артисты, бренды, редакторы, музеи) добавляйте так:
    # - {name: имя_аккаунта, region: ru}
    # - {name: имя_аккаунта, region: ru, feed: "https://ваш-rsshub/picnob/user/имя_аккаунта"}

# ── Поиск по соцсетям нейросетью (social_search) ─────────────
# Дополняет прямой Instagram: Threads и X не отдают чужие посты бесплатно,
# поэтому их ищет нейросеть с веб-поиском (anthropic, openai, openrouter).
social_accounts:
  instagram: ["diet_prada", "stylenotcom", "hautelemode", "ideservecouture"]
  threads: ["diet_prada", "stylenotcom", "bof", "wwd", "voguebusiness"]
  x: ["wwd", "BoF", "VVFriedman"]

# ── Отбор ────────────────────────────────────────────────────
topics_hint: >
  мода и люкс, культура и светская хроника, музыка, кино и стриминг,
  архитектура и дизайн, искусство и арт-рынок, соцсети и диджитал-культура, бизнес индустрии
stop_topics: []           # например ["спорт", "погода"]
max_candidates_to_llm: 60 # сколько свежих заголовков отдавать на отбор за запуск
