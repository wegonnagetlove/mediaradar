# ─────────────────────────────────────────────────────────────
#  Newsroom Radar — настройки
#  Правится только этот файл. Ключи API кладутся в Secrets GitHub, не сюда.
# ─────────────────────────────────────────────────────────────

channels: ["@aleko_n17", "@mozhetnesovpadat"]
timezone: Europe/Moscow

# ── Режимы и расписание ──────────────────────────────────────
# Расписание задаётся в .github/workflows/radar.yml (время там в UTC, Москва = UTC+3):
#   06:55 МСК       режим D, утренний выпуск: «Доброе утро!» и до 20 заголовков-ссылок
#                   за ночь; запуск чуть раньше 07:00 с поправкой на очередь GitHub
#   07:15–23:45 МСК режим B каждые 15 минут: короткие посты с фото по мере поступления
#   00:00–06:55     тишина
# B: берётся всё, что опубликовано не раньше max_age_minutes назад и ещё не попадало
#    в прошлые запуски (память в state/seen.json): задержки GitHub не дают ни пропусков, ни дублей.
# D: окно от последнего вечернего запуска до утра; уже отправленное вечером не повторяется.
# A: разовый запуск руками (Actions → Run workflow → mode A).
modes:
  A: {max_age_minutes: 60, min_posts: 3, max_posts: 5}
  B: {max_age_minutes: 60, min_posts: 0, max_posts: 3}
  D: {max_age_minutes: 450, min_posts: 0, max_posts: 20, max_candidates: 150, digest: true}

# ── Движок ───────────────────────────────────────────────────
# hybrid: код собирает ленты с точным временем, нейросеть отбирает и пишет. Рекомендуется.
# agent:  нейросеть сама ищет в вебе по prompts/editor.md (как в чате). Нужен провайдер с веб-поиском.
engine: hybrid

# Дополнительный проход нейросети с веб-поиском по Instagram / Threads / X
# (только anthropic и openai). Дороже, но ловит соцсети.
social_search: true

# Если время публикации не удалось подтвердить по самой странице
# (meta article:published_time / JSON-LD), новость отбрасывается.
# false: оставляется с пометкой «время по ленте».
strict_time: false

# ── Нейросеть ────────────────────────────────────────────────
# provider: anthropic | openai | gemini | deepseek | openrouter | custom
# Для custom задайте base_url любого OpenAI-совместимого API (Mistral, Groq, YandexGPT-шлюз, локальная Ollama).
llm:
  provider: anthropic
  model: claude-sonnet-5-5          # для качества текста можно claude-opus-5-5
  base_url: ""                      # только для custom
  temperature: 0.6
  max_tokens: 6000
  # тип инструмента веб-поиска; менять только если провайдер обновит API
  anthropic_web_search_tool: web_search_20250305
  openai_web_search_tool: web_search

# ── Telegram-уведомления ─────────────────────────────────────
notify:
  telegram: true          # TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID в Secrets
  send_empty: false       # присылать ли «Пусто», когда новостей нет
  silent_night: false     # тихие уведомления с 01:00 до 08:00 по МСК (при ночной паузе не нужно)
  save_digest: true       # архив выпусков в папке digests/
  photos: true            # днём присылать пост с фото (из Instagram, телеграм-канала, RSS или со страницы статьи)
  max_photos: 4           # больше одного фото приходит альбомом
  source_link: true       # строка «Источник» со ссылкой под постом; false, если нужен только чистый текст

# ── Конкуренты (проверка эксклюзивности) ─────────────────────
# Публичные ленты t.me/s/<имя>: последние ~20 постов каждого канала.
competitors_telegram:
  - bloodysx
  - ostorozhno_novosti
  - ksbchk
  - sncmag
  - theblueprintru
  - fashionprokachka

# Российские медиа: сюжет, найденный у них за последние сутки, считается «уже есть».
competitors_media:
  - theblueprint.ru
  - buro247.ru
  - peopletalk.ru
  - style.rbc.ru
  - daily.afisha.ru
  - pravilamag.ru
  - thesymbol.ru

# ── Источники ────────────────────────────────────────────────
sources:
